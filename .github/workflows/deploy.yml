name: Deploy a GitHub Pages

# Se ejecuta al hacer push a main, y manualmente desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# No cancelar despliegues en curso si hay uno mas reciente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # undici (dependencia transitiva) exige Node >= 22.19.
          # Se fija 22.x para garantir una version que lo cumpla.
          node-version: 22.x
      - name: Verificar version de Node
        run: |
          node --version
          npm --version
          echo "major=$(node -p 'process.versions.node.split(".")[0]') minor=$(node -p 'process.versions.node.split(".")[1]')"

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Construir el sitio
        run: npm run build
        env:
          # URL publica. Ajusta segun tu repo/usuario.
          SITE_URL: ${{ vars.SITE_URL }}
          # Deja la pagina en modo privado (noindex).
          # Cambia a "false" cuando quieras que Google la indexe.
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX || 'true' }}

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
