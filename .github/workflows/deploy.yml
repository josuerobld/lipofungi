name: Deploy a GitHub Pages

# Se ejecuta al hacer push a main, y manualmente desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# No cancelar despliegues en curso si hay uno mas reciente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # undici (dependencia transitiva) exige Node >= 22.19
          node-version: 22

      - name: Diagnóstico
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Lockfile existe: $(test -f package-lock.json && echo si || echo NO)"
          ls -la package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build
        env:
          # URL publica. Ajusta segun tu repo/usuario.
          SITE_URL: ${{ vars.SITE_URL }}
          # Deja la pagina en modo privado (noindex).
          # Cambia a "false" cuando quieras que Google la indexe.
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX || 'true' }}

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
